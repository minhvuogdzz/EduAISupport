[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cavat-api"
version = "0.1.0"
description = "CAVAT AI Tutor backend (modular monolith)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6",
  "pymongo>=4.13",
  "google-genai>=2.0",
  "httpx>=0.27",
  "python-multipart>=0.0.9",  # file uploads (DOC-1)
  "pypdf>=5.0",  # text of the teacher's PDF documents (DOC-1); scans go to Gemini OCR
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["cavat*"]

[tool.setuptools.package-data]
"cavat.modules.tutor" = ["prompts/*.md"]
