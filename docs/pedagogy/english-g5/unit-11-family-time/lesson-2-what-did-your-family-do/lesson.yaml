objectives:
  - id: LO1
    text: "Hỏi và trả lời về việc gia đình đã làm ở một nơi bằng 'What did your family do in …? – We …' (động từ sau We ở dạng quá khứ)."
    kc_ids: [ENG5-U11-WHATDID]
  - id: LO2
    text: "Hỏi và trả lời về thời gian của chuyến đi bằng 'When did you go to …? – We went there last …'."
    kc_ids: [ENG5-U11-WHATDID]

kcs:
  - id: ENG5-U11-WHATDID
    name: "What did your family do in …? – We …"
    description: "Hỏi gia đình đã làm gì ở một nơi và trả lời bằng We + động từ quá khứ; hỏi khi nào đi bằng When did you go to …?"
    prerequisites: []  # tiên quyết ENG5-U11-PAST nằm ở lesson-1 (đồ thị ở chapter.yaml là nguồn sự thật)

concepts:
  - id: C1
    name: "Câu hỏi What did your family do …?"
    explanation: "What did + your family + do + in/at + nơi chốn? Did đã báo chuyện đã qua nên do giữ nguyên. Trả lời: We + động từ quá khứ: We took a boat trip around the bay. / We ate seafood. / We saw some interesting places. / We bought souvenirs."
    representations: [hội thoại xem ảnh gia đình, khung câu hỏi – câu trả lời]
  - id: C2
    name: "Câu hỏi When did you go to …?"
    explanation: "When did you go to + nơi chốn? Trả lời: We went there + last summer / last weekend / last Sunday. Câu hỏi When hỏi thời gian, câu hỏi What hỏi việc làm."
    representations: [hội thoại xem ảnh gia đình, dòng thời gian]

misconceptions:
  - id: ENG5-U11-M07
    kc_id: ENG5-U11-WHATDID
    name: "Sau We dùng động từ nguyên mẫu"
    description: "Trả lời 'We eat seafood.', 'We buy souvenirs.' cho câu hỏi What did your family do …?. Câu trả lời kể chuyện đã qua nên động từ sau We đổi sang quá khứ."
    severity: CRITICAL
    error_class: EN_TENSE
    counter_examples:
      - "Bạn hỏi 'What did your family do in Nha Trang?' về chuyến đi đã qua. Nếu con nói 'We eat seafood', bạn có hiểu là cả nhà đã ăn hay hay ăn không?"
      - "Câu hỏi có did, câu trả lời không có did. Vậy chữ nào trong câu trả lời phải báo là chuyện đã qua?"
  - id: ENG5-U11-M08
    kc_id: ENG5-U11-WHATDID
    name: "Câu hỏi Wh- về quá khứ thiếu did hoặc dùng do"
    description: "Hỏi 'When do they go there?' về chuyện tuần trước, 'What your family did?' hoặc 'What did your family did?'. Câu hỏi Wh- về quá khứ: từ để hỏi + did + chủ ngữ + động từ giữ nguyên."
    severity: NORMAL
    error_class: EN_STRUCTURE
    counter_examples:
      - "Họ đi Quảng Ninh tuần trước rồi. Câu hỏi về chuyện đã qua thì sau When mình dùng do hay did?"
      - "Trong câu 'What did your family do?', chữ did đã báo chuyện đã qua. Động từ do ở cuối có cần đổi nữa không?"
  - id: ENG5-U11-M09
    kc_id: ENG5-U11-WHATDID
    name: "Trả lời lệch câu hỏi Wh-"
    description: "Bạn hỏi What (làm gì) mà trả lời nơi chốn hoặc thời gian, hoặc hỏi When (khi nào) mà trả lời việc làm."
    severity: NORMAL
    error_class: EN_MEANING
    counter_examples:
      - "Câu hỏi bắt đầu bằng What … do? là hỏi làm gì. Câu 'We were at Ha Long Bay last month.' nói về việc làm hay nói về nơi chốn?"
      - "When là hỏi khi nào. Câu trả lời cần có chữ chỉ thời gian như last summer, con thấy chưa?"

generic_hints:
  - {target: TASK, level: 1, text: "Con đọc lại câu hỏi giúp cô nhé: bạn hỏi làm gì, hỏi ở đâu hay hỏi khi nào?"}
  - {target: CONCEPT, level: 2, text: "Trả lời câu hỏi What did your family do …? bằng We + động từ quá khứ, ví dụ: We ate seafood."}
  - {target: STRATEGY, level: 3, text: "Con nhớ mẫu trong sách nhé: What did your family do in Ha Long? – We took a boat trip around the bay."}
  - {target: SELF_CHECK, level: 1, text: "Con kiểm tra lại động từ sau We: đã ở dạng quá khứ chưa?"}
  - {target: FORMAT, level: 1, text: "Con trả lời bằng một câu tiếng Anh trọn vẹn, bắt đầu bằng We, giúp cô nhé?"}

default_verify_prompt: "Đúng rồi! Con nói cho cô biết vì sao động từ trong câu của con ở dạng đó được không?"

