  # [SOẠN THÊM] Mức C: vì sao do giữ nguyên còn took ở dạng quá khứ.
  - id: U11-WD-PR-05
    purpose: PRACTICE
    kc_ids: [ENG5-U11-WHATDID]
    cognitive_level: C
    difficulty: 0.55
    expected_time_s: 75
    stem: "Trong câu hỏi 'What did your family do in Ha Long?', động từ do giữ nguyên. Nhưng trong câu trả lời 'We took a boat trip around the bay.', động từ lại là took. Vì sao vậy? Con trả lời bằng tiếng Việt nhé."
    origin: AUTHORED
    answer_status: AUTHORED
    review: {status: APPROVED, reviewed_by: "chủ dự án", reviewed_on: 2026-11-13}
    response_language: vi
    answer:
      type: open
      rubric: "Nêu được: câu hỏi đã có did báo chuyện đã qua nên do giữ nguyên; câu trả lời không có did nên động từ phải đổi sang quá khứ (take → took)."
      sample_answer: "Vì câu hỏi có did rồi nên do giữ nguyên. Câu trả lời không có did nên took phải ở dạng quá khứ để báo chuyện đã qua."
      facts:
        phrases: [["did"], ["giữ nguyên", "không đổi", "nguyên mẫu", "để nguyên"], ["quá khứ", "đã qua", "took"]]
    hints:
      - {target: TASK, level: 1, text: "Con tìm xem trong câu hỏi có chữ nào báo chuyện đã qua, còn câu trả lời có chữ đó không?"}
      - {target: CONCEPT, level: 2, text: "Có did thì động từ giữ nguyên. Không có did thì chính động từ phải đổi sang quá khứ."}
      - {target: STEP, level: 4, text: "Con trả lời theo ý: câu hỏi có … nên do giữ nguyên; câu trả lời không có … nên took ở dạng …"}
    worked_solution:
      - "Câu hỏi có did: did đã báo chuyện đã qua, nên do giữ nguyên."
      - "Câu trả lời không có did, nên động từ phải tự báo chuyện đã qua."
      - "Take đổi sang quá khứ là took: We took a boat trip around the bay."
    explanation: "Did báo chuyện đã qua nên trong câu hỏi do giữ nguyên. Câu trả lời không có did, nên động từ đổi sang quá khứ: take thành took."

