# TRẠNG THÁI: DRAFT — phiên ENG-3 soạn từ SGK/SGV ngày 12/11/2026; chủ dự án duyệt mặc định ngày 12/11/2026
# (sửa bất kỳ lúc nào); 20 câu soạn thêm được chủ dự án duyệt ngày 13/11/2026. ENG-3b (ADR-062): mỗi câu ghi
# nguồn, nguồn gốc, trạng thái đáp án, trạng thái duyệt và ngôn ngữ trả lời ngay trong câu; sources.yaml giữ
# bảng tổng hợp (một test kiểm hai nơi khớp nhau).
#
# Nội dung: cụm từ hoạt động kỳ nghỉ, dạng quá khứ của động từ, mẫu "Did you …? – Yes, I did. I … / No, I didn't."
# SGK tr.6–7 (Lesson 1), một phần tr.8 (cụm từ Lesson 2), Review 3 tr.37. SGV tr.178–182, 253.
#
# Quy ước (xem ../README.md):
# - Cô giảng bằng tiếng Việt; từ và câu đích bằng tiếng Anh, luôn nằm trong một câu trọn vẹn
#   ("Con nói theo cô: We swam in the sea."), không đọc một từ tiếng Anh đứng riêng (POC giọng nói, PR #139).
# - Mỗi câu ghi nguồn ở dòng chú thích ngay trên nó: [SGK tr.N …], [SGV tr.N …] là câu của sách;
#   [SOẠN THÊM] là câu phiên soạn (origin AUTHORED, đã duyệt: trường review). Câu có tranh được tả tranh bằng lời.
#   Các trường source / answer_source / origin / answer_status / review / response_language / kind: ADR-062.
# - Câu trả lời tiếng Anh dùng answer.type "phrase" (ADR-062, DI-125): accept là câu mẫu đã duyệt, required là
#   các ý phải có (mỗi nhóm là các cách nói được chấp nhận cho một ý), chuẩn hóa en-vi/1 (DI-110); wrong_answers
#   là câu sai mà hiểu lầm tương ứng tự nêu. Câu mức C trả lời bằng tiếng Việt giữ "open" + facts.phrases.
# - hint.level 1..7 theo thang gợi ý tiếng Anh DI-112 (ADR-060): H1 định hướng, H2 nhắc khái niệm, H3 chiến lược,
#   H4 cho một phần, H5 cho lựa chọn, H6 cùng làm, H7 cô đọc nguyên câu mẫu.
# - Item "nói theo cô" là item cùng làm (completion), không tính thành công (DI-108).

