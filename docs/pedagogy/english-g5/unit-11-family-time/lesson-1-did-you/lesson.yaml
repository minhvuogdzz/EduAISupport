      options:
        - {id: A, text: "nhặt vỏ sò", correct: true, aliases: ["nhặt vỏ sò", "nhặt sò", "nhặt vỏ ốc"]}
        - {id: B, text: "mua quà lưu niệm", aliases: ["mua quà"], misconceptions: [ENG5-U11-M06]}
        - {id: C, text: "ăn hải sản", aliases: ["ăn hải sản"], misconceptions: [ENG5-U11-M06]}
    hints:
      - {target: TASK, level: 1, text: "Con nghe lại câu của Lan: I collected seashells with my brother. Từ seashells nói về thứ gì ở bãi biển?"}
      - {target: CONCEPT, level: 2, text: "Seashells là vỏ sò, vỏ ốc trên cát. Collect seashells là làm gì với chúng?"}
    explanation: "Collect seashells nghĩa là nhặt vỏ sò. Câu 'I collected seashells with my brother.' nghĩa là Lan đã nhặt vỏ sò cùng anh trai."

  # [SOẠN THÊM] Nói theo cô (cùng làm, DI-108).
  - id: U11-VO-CP-01
    purpose: PRACTICE
    kc_ids: [ENG5-U11-VOCAB]
    cognitive_level: A
    difficulty: 0.1
    expected_time_s: 30
    stem: "Cô đọc trước, con nói theo cô cả câu nhé: We took a boat trip around the bay."
    source: {doc: SGK, page: "8", ref: "L2 Ex1b, câu đích"}
    origin: AUTHORED
    answer_status: AUTHORED
    review: {status: APPROVED, reviewed_by: "chủ dự án", reviewed_on: 2026-11-13}
    response_language: en
    kind: say_after_me
    answer:
      type: phrase
      accept: ["We took a boat trip around the bay."]
      required: [["took a boat trip"], ["around the bay"]]
    hints:
      - {target: TASK, level: 1, text: "Con nghe cô đọc chậm lại nhé: We took a boat trip around the bay. Con nói theo được không?"}
      - {target: CONCEPT, level: 2, text: "Cụm này có ba phần: took a boat trip (đi thuyền), around (quanh), the bay (vịnh). Con nói từng phần theo cô nhé?"}
      - {target: STEP, level: 4, text: "Con nói nửa đầu trước: We took a boat trip. Rồi nói tiếp: around the bay."}
    worked_solution:
      - "Nói nửa đầu: We took a boat trip."
      - "Nói nửa sau: around the bay."
      - "Ghép lại: We took a boat trip around the bay."
    explanation: "Câu 'We took a boat trip around the bay.' nghĩa là cả nhà đã đi thuyền quanh vịnh."

  # [SGV tr.181, Ex4 câu 4 — chuyển thể audio script thành câu đọc; SGK tr.7] Nhận biết hoạt động qua câu kể.
  - id: U11-VO-PR-01
    purpose: PRACTICE
    kc_ids: [ENG5-U11-VOCAB]
    cognitive_level: A
    difficulty: 0.2
    expected_time_s: 40
    stem: "Bạn Ben kể: 'I walked on the beach at Co To Island with my family.' Ben đã làm gì cùng gia đình?"
    source: {doc: SGV, page: "181", ref: "L1 Ex4 audio script câu 4, chuyển thành câu đọc (SGK tr.7)"}
    answer_source: {doc: SGV, page: "182", ref: "Key L1 Ex4: 4a"}
    origin: BOOK
    answer_status: VERIFIED_SGV
    response_language: either
    answer:
      type: choice
      options:
        - {id: A, text: "đi dạo trên bãi biển", correct: true, aliases: ["đi dạo trên bãi biển", "đi dạo bãi biển", "đi bộ trên bãi biển"]}
        - {id: B, text: "đi thuyền quanh đảo", aliases: ["đi thuyền"], misconceptions: [ENG5-U11-M06]}
        - {id: C, text: "chụp ảnh", aliases: ["chụp ảnh"], misconceptions: [ENG5-U11-M06]}
    hints:
      - {target: TASK, level: 1, text: "Trong câu của Ben, con tìm cụm nói về việc làm nhé: I walked on the beach. Cụm đó là gì?"}
      - {target: CONCEPT, level: 2, text: "Walk là đi bộ, on the beach là trên bãi biển. Ghép lại là làm gì nhỉ?"}
      - {target: STEP, level: 4, text: "Walked on the beach là đã đi … trên bãi biển. Con điền tiếp việc làm đó bằng tiếng Việt nhé?"}
    worked_solution:
      - "Cụm chỉ việc làm trong câu là walked on the beach."
      - "Walk on the beach nghĩa là đi dạo trên bãi biển; walked là đã đi."
      - "Vậy Ben đã đi dạo trên bãi biển cùng gia đình."
    explanation: "Walked on the beach là đã đi dạo trên bãi biển. Ben đã đi dạo trên bãi biển ở đảo Cô Tô cùng gia đình."

  # [SGK tr.8 Ex2b; SGV tr.184 audio] Tranh được tả bằng lời. Nói cụm theo tranh (mức B).
  - id: U11-VO-PR-02
    purpose: PRACTICE
    kc_ids: [ENG5-U11-VOCAB]
    cognitive_level: B
    difficulty: 0.3
    expected_time_s: 45
    stem: "Trong tranh, cả nhà đang ngồi quanh bàn có tôm, cua, cá ở Nha Trang. Con nói câu kể việc cả nhà làm, bắt đầu bằng: We ate …"
    source: {doc: SGK, page: "8", ref: "L2 Ex2b, tả tranh bằng lời"}
    answer_source: {doc: SGV, page: "184", ref: "audio script L2 Ex2b"}
    origin: BOOK
    answer_status: VERIFIED_SGV
    response_language: en
    answer:
      type: phrase
      accept: ["We ate seafood."]
      required: [["ate seafood", "ate some seafood"]]
      wrong_answers: {"we eat seafood": ENG5-U11-M04}
    hints:
      - {target: TASK, level: 1, text: "Tôm, cua, cá gọi chung là gì trong tiếng Anh, con còn nhớ không?"}
      - {target: CONCEPT, level: 2, text: "Đồ ăn từ biển như tôm, cua, cá gọi chung là seafood. Ăn hải sản là eat seafood."}
      - {target: STEP, level: 4, text: "Câu bắt đầu là We ate … Con thêm từ chỉ tôm, cua, cá vào cuối câu nhé: We ate s…"}
    worked_solution:
      - "Tôm, cua, cá là hải sản, tiếng Anh là seafood."
      - "Ăn hải sản là eat seafood; kể chuyện đã qua thì eat đổi thành ate."
      - "Câu hoàn chỉnh: We ate seafood."
    explanation: "Tôm, cua, cá là seafood. Cả nhà đã ăn hải sản thì nói: We ate seafood."

  # [SOẠN THÊM] Mức C: vì sao chọn cụm này cho tranh.
  - id: U11-VO-PR-03
    purpose: PRACTICE
    kc_ids: [ENG5-U11-VOCAB]
    cognitive_level: C
    difficulty: 0.45
    expected_time_s: 60
    stem: "Trong tranh, cả nhà đứng trước một quầy bán móc khóa, mũ và áo có in hình Singapore. Vì sao câu 'We bought souvenirs.' hợp với tranh hơn câu 'We saw some interesting places.'? Con trả lời bằng tiếng Việt nhé."
    origin: AUTHORED
    answer_status: AUTHORED
    review: {status: APPROVED, reviewed_by: "chủ dự án", reviewed_on: 2026-11-13}
    response_language: vi
    answer:
      type: open
      rubric: "Nói được buy/bought là mua và souvenirs là quà lưu niệm (đồ ở quầy); còn see some interesting places là đi xem nơi thú vị, không phải mua đồ."
      sample_answer: "Vì cả nhà đang mua đồ ở quầy quà lưu niệm; bought souvenirs là đã mua quà lưu niệm, còn saw some interesting places là đi xem nơi thú vị."
      facts:
        phrases: [["mua"], ["quà", "lưu niệm", "đồ"]]
    hints:
      - {target: TASK, level: 1, text: "Trong tranh, cả nhà đang làm gì ở quầy hàng: đang ngắm cảnh hay đang mua đồ?"}
      - {target: CONCEPT, level: 2, text: "Bought là đã mua, souvenirs là quà lưu niệm. Còn see some interesting places là đi xem những nơi thú vị."}
      - {target: STEP, level: 4, text: "Con nói theo ý này nhé: cả nhà đang mua … ở quầy, nên dùng câu …"}
    worked_solution:
      - "Nhìn tranh: cả nhà đứng ở quầy bán đồ lưu niệm, tức là đang mua đồ."
      - "We bought souvenirs nghĩa là cả nhà đã mua quà lưu niệm, đúng với tranh."
      - "We saw some interesting places là đi xem nơi thú vị, không phải việc ở quầy hàng."
    explanation: "Cả nhà đang mua đồ ở quầy quà lưu niệm, nên nói 'We bought souvenirs.' (đã mua quà lưu niệm). Câu 'We saw some interesting places.' là đi xem những nơi thú vị."

  # [SOẠN THÊM] Tìm lỗi (DIAG).
  - id: U11-VO-PR-04
    purpose: PRACTICE
    kc_ids: [ENG5-U11-VOCAB]
    cognitive_level: DIAG
    difficulty: 0.4
    expected_time_s: 60
    stem: "Bạn Nam nhìn tranh hai bạn đang cúi xuống cát nhặt vỏ sò, rồi nói: 'They bought souvenirs.' Bạn Nam nói đúng chưa? Nếu chưa, con sửa giúp bạn nhé?"
    origin: AUTHORED
    answer_status: AUTHORED
    review: {status: APPROVED, reviewed_by: "chủ dự án", reviewed_on: 2026-11-13}
    response_language: either
