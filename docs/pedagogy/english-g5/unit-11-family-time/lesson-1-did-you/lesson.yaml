version: 0.2.0
status: DRAFT
subject: english
grade: 5
locale: vi-VN
title: "Unit 11 Family time — Lesson 1: Did you …?"
persona:
  tutor_self: cô
  student_address: con

objectives:
  - id: LO1
    text: "Nhận ra và nói được các cụm từ hoạt động kỳ nghỉ của Unit 11 trong câu: swim, take photos, collect seashells, walk on the beach, take a boat trip around the bay, eat seafood, see some interesting places, buy souvenirs."
    kc_ids: [ENG5-U11-VOCAB]
  - id: LO2
    text: "Đổi được động từ của các cụm trên sang dạng quá khứ khi kể chuyện đã xảy ra (swam, took, collected, walked, ate, saw, bought, went, were)."
    kc_ids: [ENG5-U11-PAST]
  - id: LO3
    text: "Hỏi và trả lời ai đó đã làm việc gì chưa bằng 'Did you …? – Yes, I did. I … / No, I didn't.'"
    kc_ids: [ENG5-U11-DIDYOU]

kcs:
  - id: ENG5-U11-VOCAB
    name: "Cụm từ hoạt động kỳ nghỉ"
    description: "Tám cụm động từ chỉ việc làm trong chuyến đi của gia đình (SGK tr.6, tr.8; Book map tr.4)."
    prerequisites: []
  - id: ENG5-U11-PAST
    name: "Dạng quá khứ của động từ"
    description: "Kể chuyện đã xảy ra thì đổi động từ sang quá khứ: thêm -ed (walked, collected) hoặc nhớ dạng riêng (swam, took, ate, saw, bought, went, were)."
    prerequisites: [ENG5-U11-VOCAB]
  - id: ENG5-U11-DIDYOU
    name: "Did you …? – Yes, I did. / No, I didn't."
    description: "Hỏi ai đó đã làm việc gì chưa; trả lời Yes, I did. hoặc No, I didn't., rồi có thể kể thêm bằng động từ quá khứ."
    prerequisites: [ENG5-U11-PAST]

concepts:
  - id: C1
    name: "Tám cụm từ hoạt động kỳ nghỉ"
    explanation: "swim (bơi), take photos (chụp ảnh), collect seashells (nhặt vỏ sò), walk on the beach (đi dạo trên bãi biển), take a boat trip around the bay (đi thuyền quanh vịnh), eat seafood (ăn hải sản), see some interesting places (đi xem vài nơi thú vị), buy souvenirs (mua quà lưu niệm)."
    representations: [tranh kỳ nghỉ, diễn tả bằng động tác, câu kể của bạn trong sách]
  - id: C2
    name: "Dạng quá khứ của động từ trong unit"
    explanation: "Thêm -ed: walk → walked, collect → collected, visit → visited. Dạng riêng phải nhớ: swim → swam, take → took, eat → ate, see → saw, buy → bought, go → went, am/is → was, are → were."
    representations: [dòng thời gian, bảng hai cột nguyên mẫu – quá khứ]
  - id: C3
    name: "Câu hỏi Did you …?"
    explanation: "Hỏi về việc đã qua: Did + you + động từ nguyên mẫu …? Trả lời: Yes, I did. hoặc No, I didn't. Kể thêm thì dùng động từ quá khứ: Yes, I did. I swam with my mother. Sau did, động từ giữ nguyên: Did you swim? (không nói Did you swam?)."
    representations: [hội thoại mẫu SGK, so sánh do và did]

misconceptions:
  - id: ENG5-U11-M01
    kc_id: ENG5-U11-DIDYOU
    name: "Hỏi chuyện đã qua mà dùng do hoặc bỏ did"
    description: "Hỏi về hôm qua, tuần trước mà nói 'Do you swim yesterday?' hoặc 'You swam yesterday?'. Câu hỏi về quá khứ cần did."
    severity: CRITICAL
    error_class: EN_STRUCTURE
    counter_examples:
      - "Nếu bạn hỏi con 'Do you swim?' thì bạn đang hỏi con có hay bơi không, hay hỏi hôm qua con đã bơi chưa?"
      - "Câu hỏi có chữ 'yesterday' (hôm qua) thì mình mở đầu bằng Do hay bằng Did cho hợp nhỉ?"
  - id: ENG5-U11-M02
    kc_id: ENG5-U11-DIDYOU
    name: "Sau did vẫn đổi động từ sang quá khứ"
    description: "Nói 'Did you swam?', 'Did you walked on the beach?'. Did đã cho biết chuyện đã qua, nên động từ sau did giữ nguyên."
    severity: CRITICAL
    error_class: EN_STRUCTURE
    counter_examples:
      - "Trong câu 'Did you swim?', chữ nào đã cho mình biết đây là chuyện đã qua rồi?"
      - "Chữ did đã báo 'đã qua' rồi. Nếu đổi thêm swim thành swam thì câu báo 'đã qua' mấy lần?"
  - id: ENG5-U11-M03
    kc_id: ENG5-U11-DIDYOU
    name: "Nhầm Yes, I did với Yes, I do (hoặc Yes, I will)"
    description: "Bạn hỏi 'Did you take photos?' mà trả lời 'Yes, I do.' hoặc 'Yes, I will.'. Câu hỏi bằng did thì trả lời bằng did."
    severity: CRITICAL
    error_class: EN_SHORT_ANSWER
    counter_examples:
      - "Bạn hỏi bằng chữ did. Vậy con trả lời Yes, I … bằng chữ nào cho khớp với câu hỏi?"
      - "'Yes, I will.' là con sẽ làm. Bạn hỏi con đã làm hay sẽ làm?"
  - id: ENG5-U11-M04
    kc_id: ENG5-U11-PAST
    name: "Kể chuyện đã qua bằng động từ nguyên mẫu"
    description: "Kể 'I swim with my father yesterday', 'We are at the Golden Pagoda last summer'. Chuyện đã xảy ra thì động từ đổi sang quá khứ."
    severity: CRITICAL
    error_class: EN_TENSE
    counter_examples:
      - "Câu có 'yesterday' (hôm qua). Hôm qua đã qua rồi hay chưa tới, con nhỉ?"
      - "Nếu con nói 'I swim with my father' thì bạn nghe sẽ hiểu con hay bơi, hay hôm qua con đã bơi?"
  - id: ENG5-U11-M05
    kc_id: ENG5-U11-PAST
    name: "Thêm -ed cho động từ có dạng quá khứ riêng"
    description: "Viết 'swimmed', 'taked', 'eated', 'buyed', 'goed'. Các động từ này có dạng quá khứ riêng: swam, took, ate, bought, went."
    severity: NORMAL
    error_class: EN_VERB_FORM
    counter_examples:
      - "Walk thành walked là thêm -ed. Còn take có thêm -ed được không, hay nó có dạng riêng là took?"
  - id: ENG5-U11-M06
    kc_id: ENG5-U11-VOCAB
    name: "Nhầm nghĩa giữa các cụm hoạt động"
    description: "Gọi việc nhặt vỏ sò là 'buy souvenirs', gọi việc tham quan là 'eat seafood'... Nhầm nghĩa cụm hoặc nhầm tranh."
    severity: NORMAL
    error_class: EN_MEANING
    counter_examples:
      - "Hai bạn đang cúi xuống cát nhặt vỏ ốc, vỏ sò. Hai bạn có đang trả tiền mua đồ không con?"
      - "'Souvenirs' là quà lưu niệm, thứ mình mua mang về. Vậy 'buy souvenirs' là làm gì?"

generic_hints:
  - {target: TASK, level: 1, text: "Con đọc lại câu hỏi giúp cô nhé: câu này hỏi về chuyện đã qua hay chuyện thường ngày?"}
  - {target: CONCEPT, level: 2, text: "Chuyện đã qua thì động từ đổi sang quá khứ, ví dụ: We swam in the sea."}
  - {target: STRATEGY, level: 3, text: "Con nhớ mẫu cô vừa giảng nhé: Did you swim? – Yes, I did. I swam with my mother."}
  - {target: SELF_CHECK, level: 1, text: "Con đọc to câu trả lời của mình một lần nữa, nghe đã giống câu kể chuyện hôm qua chưa?"}
  - {target: FORMAT, level: 1, text: "Con trả lời bằng một câu tiếng Anh trọn vẹn giúp cô nhé?"}

default_verify_prompt: "Đúng rồi! Con nói cho cô biết vì sao con chọn cách nói đó được không?"

items:
  # ================================================================ ENG5-U11-VOCAB
  # [SOẠN THÊM] Nhận biết nghĩa cụm (mức A).
  - id: U11-VO-CC-01
    purpose: CONCEPT_CHECK
    kc_ids: [ENG5-U11-VOCAB]
    cognitive_level: A
    difficulty: 0.15
    expected_time_s: 30
    stem: "Bạn Lan kể: 'I collected seashells with my brother.' Bạn ấy đã làm gì cùng anh trai?"
    origin: AUTHORED
    answer_status: AUTHORED
    review: {status: APPROVED, reviewed_by: "chủ dự án", reviewed_on: 2026-11-13}
