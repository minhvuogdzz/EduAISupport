    stem: "Bạn Hoa kể: 'Last summer, my family go to Hue. We visit the citadel and eat bun bo.' Có ba động từ chưa đổi sang quá khứ. Con sửa lại giúp bạn nhé."
    answer:
      type: open
      rubric: "Sửa đủ ba động từ: go → went, visit → visited, eat → ate."
      sample_answer: "Last summer, my family went to Hue. We visited the citadel and ate bun bo."
