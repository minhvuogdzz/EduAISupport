      - "Chuyện mùa hè năm ngoái đã qua: go → went, visit → visited, eat → ate."
      - "Đoạn đúng: Last summer, my family went to Hue. We visited the citadel and ate bun bo."
    explanation: "Đoạn kể chuyện đã qua nên đổi cả ba động từ: went, visited, ate."

  # [SOẠN THÊM] Vận dụng (mức D): hội thoại hai lượt với cụm của unit.
  - id: U11-TR-TR-01
    purpose: PRACTICE
    kc_ids: [ENG5-U11-TRIP]
    cognitive_level: D
    difficulty: 0.6
    transfer: near
    expected_time_s: 75
    stem: "Bạn hỏi: 'Where did your family go last summer?' Con đáp: 'We went to Phu Quoc.' Bạn hỏi tiếp: 'What did your family do there?' Trong ảnh, cả nhà con đang đi thuyền quanh đảo và ăn hải sản. Con trả lời câu hỏi cuối nhé."
    answer:
      type: open
      rubric: "We + took a boat trip + ate seafood (hai việc, động từ quá khứ)."
      sample_answer: "We took a boat trip and ate seafood."
      facts:
        phrases: [["took a boat trip"], ["ate seafood", "ate some seafood"]]
    hints:
      - {target: TASK, level: 1, text: "Bạn hỏi cả nhà đã làm gì ở Phú Quốc. Trong ảnh có mấy việc?"}
      - {target: CONCEPT, level: 2, text: "Trả lời bằng We + động từ quá khứ; hai việc thì nối bằng and."}
      - {target: STEP, level: 4, text: "Con nói nhé: We took a boat trip and ate …"}
    worked_solution:
      - "Ảnh có hai việc: đi thuyền (take a boat trip) và ăn hải sản (eat seafood)."
      - "Kể chuyện đã qua: took, ate; nối hai việc bằng and."
      - "Câu trả lời: We took a boat trip and ate seafood."
    explanation: "Cả nhà đã đi thuyền và ăn hải sản: We took a boat trip and ate seafood."

  # [SOẠN THÊM, theo khung SGK tr.11 Ex5 và Project tr.11] Vận dụng bối cảnh mới (mức E). Bài mở: chấm theo facts tối thiểu,
  # nội dung tự do. Facts chỉ kiểm có kể đi đâu bằng went to và có mốc thời gian last …
  - id: U11-TR-TR-02
    purpose: PRACTICE
    kc_ids: [ENG5-U11-TRIP]
    cognitive_level: E
    difficulty: 0.7
    transfer: far
    expected_time_s: 120
    stem: "Con kể cho cô nghe về một chuyến đi của gia đình con (chuyến thật hoặc tưởng tượng) bằng ba câu: đi đâu và khi nào, cả nhà làm gì, con thấy chuyến đi thế nào. Con nhớ dùng động từ quá khứ nhé."
    answer:
      type: open
      rubric: "Ba câu ở thì quá khứ: đi đâu + khi nào (went to … last …), làm gì (We + động từ quá khứ), cảm nhận (It was … / Our trip was …). Nội dung tự do."
      sample_answer: "Last summer, my family went to Da Lat. We visited a flower garden and took lots of photos. Our trip was great."
      facts:
        phrases: [["went to"], ["last"]]
    hints:
      - {target: TASK, level: 1, text: "Con nghĩ về một chuyến đi nhé: cả nhà đi đâu, đi khi nào?"}
      - {target: CONCEPT, level: 2, text: "Câu đầu theo khung: Last summer, my family went to … Câu sau kể việc làm với We + động từ quá khứ."}
      - {target: STEP, level: 4, text: "Câu đầu: Last … , my family went to … Câu hai: We … Câu ba: Our trip was …"}
    worked_solution:
      - "Câu 1, đi đâu và khi nào: Last summer, my family went to Da Lat."
      - "Câu 2, làm gì: We visited a flower garden and took lots of photos."
      - "Câu 3, cảm nhận: Our trip was great."
    explanation: "Một đoạn kể chuyến đi có ba ý: đi đâu và khi nào (went to … last …), làm gì (We + động từ quá khứ), và chuyến đi thế nào."
