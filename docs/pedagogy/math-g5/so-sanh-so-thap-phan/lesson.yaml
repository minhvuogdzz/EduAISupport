title: So sánh hai số thập phân
persona:
  tutor_self: cô
  student_address: con

objectives:
  - id: LO1
    text: "So sánh được hai số thập phân: so sánh phần nguyên trước, rồi lần lượt từng hàng của phần thập phân."
    kc_ids: [KC-DEC-CMP]
  - id: LO2
    text: "Nhận biết hai số thập phân bằng nhau khi viết thêm hoặc bỏ chữ số 0 ở tận cùng bên phải phần thập phân."
    kc_ids: [KC-DEC-EQ]
  - id: LO3
    text: "Sắp xếp các số thập phân theo thứ tự và vận dụng so sánh trong tình huống thực tế."
    kc_ids: [KC-DEC-ORDER, KC-DEC-APPLY]

kcs:
  - id: KC-DEC-PLACE
    name: Giá trị theo hàng của số thập phân
    description: "Nhận biết hàng phần mười, phần trăm, phần nghìn và giá trị của mỗi chữ số."
    prerequisites: []
  - id: KC-DEC-EQ
    name: Số thập phân bằng nhau
    description: "Viết thêm hoặc bỏ chữ số 0 ở tận cùng bên phải phần thập phân thì giá trị không đổi."
    prerequisites: [KC-DEC-PLACE]
  - id: KC-DEC-CMP
    name: So sánh hai số thập phân
    description: "So sánh phần nguyên, nếu bằng nhau thì so sánh lần lượt từng hàng của phần thập phân."
    prerequisites: [KC-DEC-PLACE, KC-DEC-EQ]
  - id: KC-DEC-ORDER
    name: Sắp xếp thứ tự các số thập phân
    description: "Xếp các số thập phân theo thứ tự từ bé đến lớn hoặc ngược lại."
    prerequisites: [KC-DEC-CMP, KC-DEC-PLACE]
  - id: KC-DEC-APPLY
    name: Vận dụng so sánh số thập phân
    description: "Dùng so sánh số thập phân trong bài toán thực tế (thời gian, khối lượng, chiều cao...)."
    prerequisites: [KC-DEC-CMP]

concepts:
  - id: C1
    name: Quy tắc so sánh hai số thập phân
    explanation: "Muốn so sánh hai số thập phân, ta so sánh phần nguyên trước. Nếu phần nguyên bằng nhau, ta so sánh lần lượt hàng phần mười, hàng phần trăm, hàng phần nghìn... cho đến khi gặp hàng có chữ số khác nhau."
    representations: [bảng hàng, trục số, tiền, đo độ dài]
  - id: C2
    name: Số thập phân bằng nhau
    explanation: "Nếu viết thêm (hoặc bỏ đi) chữ số 0 ở tận cùng bên phải phần thập phân thì được một số thập phân bằng nó, ví dụ 0,5 = 0,50 = 0,500."
    representations: [bảng hàng, phân số thập phân]

misconceptions:
  - id: DEC-M01
    kc_id: KC-DEC-CMP
    name: "Dài hơn thì lớn hơn"
    description: "So sánh phần thập phân như số tự nhiên, ví dụ nghĩ 0,25 > 0,3 vì 25 > 3."
    bug_rule: longer_is_larger
    severity: CRITICAL
    counter_examples:
      - "Nếu có {left} mét dây và {right} mét dây, con thử đổi cả hai ra xăng-ti-mét rồi xem đoạn nào dài hơn nhé?"
      - "0,9 mét là 90 xăng-ti-mét, còn 0,85 mét là 85 xăng-ti-mét. Vậy số có nhiều chữ số hơn có phải lúc nào cũng lớn hơn không?"
  - id: DEC-M02
    kc_id: KC-DEC-CMP
    name: "Ngắn hơn thì lớn hơn"
    description: "Cho rằng số có ít chữ số ở phần thập phân hơn thì lớn hơn, ví dụ nghĩ 0,4 > 0,45."
    bug_rule: shorter_is_larger
    severity: CRITICAL
    counter_examples:
      - "Con thử viết thêm chữ số 0 vào số ngắn hơn để hai số có cùng số chữ số ở phần thập phân, rồi so sánh lại {left} và {right} nhé?"
      - "Nếu số có nhiều chữ số hơn luôn bé hơn thì 0,99 phải bé hơn 0,1. Con thấy điều đó có đúng không?"
  - id: DEC-M03
    kc_id: KC-DEC-PLACE
    name: "Bỏ qua chữ số 0 giữ chỗ"
    description: "Bỏ qua chữ số 0 ngay sau dấu phẩy, ví dụ nghĩ 0,05 = 0,5."
    bug_rule: ignore_zero_placeholder
    severity: CRITICAL
    counter_examples:
      - "Chữ số ngay sau dấu phẩy thuộc hàng phần mười. Ở {left} và {right}, chữ số hàng phần mười lần lượt là mấy?"
      - "0,07 mét là 7 xăng-ti-mét, còn 0,7 mét là 70 xăng-ti-mét. Hai đoạn dây đó có dài bằng nhau không?"
  - id: DEC-M04
    kc_id: KC-DEC-CMP
    name: "Bỏ qua phần nguyên"
    description: "Chỉ so sánh phần thập phân mà quên phần nguyên, ví dụ nghĩ 2,1 < 1,99."
    bug_rule: ignore_integer_part
    severity: CRITICAL
    counter_examples:
      - "Con so sánh phần nguyên của {left} và {right} trước nhé, phần nguyên nào lớn hơn?"
      - "Một số có phần nguyên là 2 và một số có phần nguyên là 1, số nào lớn hơn dù phần thập phân của chúng thế nào?"
  - id: DEC-M05
    kc_id: KC-DEC-EQ
    name: "Thêm chữ số 0 ở cuối làm số lớn hơn"
    description: "Cho rằng viết thêm chữ số 0 ở cuối phần thập phân làm số lớn hơn, ví dụ nghĩ 0,50 > 0,5."
    bug_rule: trailing_zero_larger
    severity: NORMAL
    counter_examples:
      - "Nếu con có {left} kg gạo và bạn có {right} kg gạo, chữ số 0 ở cuối có làm lượng gạo nhiều hơn không?"
      - "0,5 là 5 phần mười, còn 0,50 là 50 phần trăm. 50 phần trăm có bằng 5 phần mười không?"
  - id: APPLY-TIME-SPEED
    kc_id: KC-DEC-APPLY
    name: "Nhiều giây hơn thì nhanh hơn"
    description: "So sánh số đúng nhưng hiểu nhầm rằng chạy hết nhiều thời gian hơn là chạy nhanh hơn. Không phải lỗi số thập phân, không tính vào KC-DEC-CMP."
    severity: NORMAL
    counter_examples:
      - "Hai bạn chạy cùng một quãng đường. Bạn về đích sau ít giây hơn thì chạy nhanh hơn hay chậm hơn?"

# Gợi ý dự phòng dùng chung (khi câu hỏi chưa có gợi ý đúng mức).
generic_hints:
  - {target: TASK, level: 1, text: "Con đọc to giúp cô: đề bài muốn mình so sánh những số nào?"}
  - {target: CONCEPT, level: 2, text: "Khi so sánh hai số thập phân, mình so sánh phần nào trước: phần nguyên hay phần thập phân?"}
  - {target: STRATEGY, level: 3, text: "Con thử so sánh theo thứ tự: phần nguyên trước, rồi lần lượt hàng phần mười, hàng phần trăm xem?"}
  - {target: STEP, level: 4, text: "Bước đầu tiên là so sánh phần nguyên. Phần nguyên của các số là mấy, có bằng nhau không?"}
  - {target: STEP, level: 5, text: "Mình làm từng bước nhỏ nhé. Bước 1: phần nguyên của các số là mấy?"}
  - {target: SELF_CHECK, level: 1, text: "Con kiểm tra lại từng hàng một lần nữa giúp cô nhé?"}
  - {target: FORMAT, level: 1, text: "Con trả lời đúng theo yêu cầu của đề giúp cô nhé?"}

default_verify_prompt: "Đúng rồi! Con giải thích cho cô vì sao con làm như vậy được không?"

items:
  # ------------------------------------------------------------ CONCEPT_CHECK
  - id: CC-01
    purpose: CONCEPT_CHECK
    kc_ids: [KC-DEC-PLACE]
    cognitive_level: A
    difficulty: 0.2
    expected_time_s: 30
    stem: "Trong số 3,47, chữ số 4 thuộc hàng nào: hàng đơn vị, hàng phần mười hay hàng phần trăm?"
    answer:
      type: choice
      options:
        - {id: A, text: "hàng phần mười", correct: true, aliases: ["phần mười"]}
        - {id: B, text: "hàng phần trăm", aliases: ["phần trăm"]}
        - {id: C, text: "hàng đơn vị", aliases: ["đơn vị"]}
    hints:
      - {target: TASK, level: 1, text: "Chữ số 4 đứng ở bên trái hay bên phải dấu phẩy?"}
      - {target: CONCEPT, level: 2, text: "Chữ số đứng ngay sau dấu phẩy thuộc hàng nào nhỉ?"}
      - {target: STRATEGY, level: 3, text: "Con thử kẻ bảng hàng: đơn vị, phần mười, phần trăm, rồi đặt từng chữ số của 3,47 vào đúng cột xem?"}
    worked_solution:
      - "Chữ số 3 đứng trước dấu phẩy nên thuộc hàng đơn vị."
      - "Chữ số đứng ngay sau dấu phẩy thuộc hàng phần mười."
      - "Vậy chữ số 4 thuộc hàng phần mười."
    explanation: "Chữ số đứng ngay sau dấu phẩy thuộc hàng phần mười. Trong 3,47, chữ số 4 đứng ngay sau dấu phẩy nên thuộc hàng phần mười."
    leak_patterns: ["\\b4 (thuộc|ở|là) hàng phần mười\\b"]

  - id: CC-02
    purpose: CONCEPT_CHECK
    kc_ids: [KC-DEC-CMP]
    cognitive_level: B
    difficulty: 0.4
    stem: "Điền dấu >, < hoặc = vào chỗ chấm: 0,7 … 0,65"
    answer: {type: compare, left: "0,7", right: "0,65"}
    hints:
      - {target: TASK, level: 1, text: "Mình cần so sánh 0,7 và 0,65. Con đọc to hai số này giúp cô nhé?"}
      - {target: CONCEPT, level: 2, text: "Hai số có cùng phần nguyên là 0. Vậy mình so sánh tiếp hàng nào trước?"}
      - {target: STRATEGY, level: 3, text: "Con thử viết 0,7 thành 0,70 rồi so sánh với 0,65 theo từng hàng được không?"}
    worked_solution:
      - "Phần nguyên của hai số đều là 0."
      - "Ở hàng phần mười: 0,7 có chữ số 7, còn 0,65 có chữ số 6."
      - "Vì 7 > 6 nên 0,7 > 0,65."
    explanation: "Phần nguyên đều là 0. Ở hàng phần mười, 0,7 có chữ số 7 còn 0,65 có chữ số 6. Vì 7 > 6 nên 0,7 > 0,65."
    rephrase: "Giữa 0,7 và 0,65, con điền dấu >, < hay = giúp cô nhé?"

  - id: CC-03
    purpose: CONCEPT_CHECK
    kc_ids: [KC-DEC-CMP]
    cognitive_level: C
    difficulty: 0.55
    stem: "Vì sao 0,7 lớn hơn 0,65 dù 65 lớn hơn 7?"
    answer:
      type: open
      rubric: "Nêu được cách so sánh theo hàng: hàng phần mười 7 > 6 (hoặc 0,7 = 0,70 > 0,65)."
      sample_answer: "Vì ở hàng phần mười, 0,7 có chữ số 7 còn 0,65 có chữ số 6, mà 7 lớn hơn 6."
    hints:
      - {target: TASK, level: 1, text: "Khi so sánh 0,7 và 0,65, con nhìn hàng nào trước?"}
      - {target: CONCEPT, level: 2, text: "Chữ số 7 trong 0,7 và chữ số 6 trong 0,65 cùng thuộc hàng nào?"}

  # ------------------------------------------------------------ GUIDED_PRACTICE
  - id: GP-01
    purpose: PRACTICE
    kc_ids: [KC-DEC-CMP]
    cognitive_level: B
    difficulty: 0.4
    isomorphic_group: G1
    stem: "Điền dấu >, < hoặc = vào chỗ chấm: 0,25 … 0,3"
    answer: {type: compare, left: "0,25", right: "0,3"}
    rephrase: "Giữa 0,25 và 0,3, con điền dấu >, < hay = giúp cô nhé?"
    verify_prompt: "Đúng rồi! Con giải thích giúp cô vì sao 0,25 bé hơn 0,3 được không?"
    hints:
      - {target: TASK, level: 1, text: "Mình cần so sánh hai số 0,25 và 0,3. Con đọc to hai số này giúp cô nhé?"}
      - {target: CONCEPT, level: 2, text: "Khi hai số có phần nguyên bằng nhau, mình so sánh hàng nào trước: hàng phần mười hay hàng phần trăm?"}
      - {target: STRATEGY, level: 3, text: "Con thử viết 0,3 thành 0,30 để hai số cùng có hai chữ số ở phần thập phân, rồi so sánh 0,25 và 0,30 được không?"}
      - {target: STEP, level: 4, text: "Phần nguyên của hai số đều là 0. Ở hàng phần mười, 0,25 có chữ số 2, còn 0,3 có chữ số 3. Chữ số nào lớn hơn?"}
      - {target: STEP, level: 5, text: "Mình làm từng bước nhỏ nhé. Bước 1: chữ số hàng phần mười của 0,25 là mấy?"}
    worked_solution:
      - "Phần nguyên của hai số đều là 0, nên mình so sánh phần thập phân."
      - "Ở hàng phần mười: 0,25 có chữ số 2, còn 0,3 có chữ số 3."
      - "Vì 2 < 3 nên 0,25 < 0,3."
    explanation: "Phần nguyên của hai số đều là 0. Ở hàng phần mười, 0,25 có chữ số 2 còn 0,3 có chữ số 3. Vì 2 < 3 nên 0,25 < 0,3."

  - id: GP-01b
    purpose: PRACTICE
    kc_ids: [KC-DEC-CMP]
    cognitive_level: B
    difficulty: 0.4
    isomorphic_group: G1
    stem: "Điền dấu >, < hoặc = vào chỗ chấm: 0,36 … 0,4"
    answer: {type: compare, left: "0,36", right: "0,4"}
    hints:
      - {target: TASK, level: 1, text: "Mình cần so sánh hai số 0,36 và 0,4. Con đọc to hai số này giúp cô nhé?"}
      - {target: CONCEPT, level: 2, text: "Khi hai số có phần nguyên bằng nhau, mình so sánh hàng nào trước?"}
      - {target: STEP, level: 4, text: "Ở hàng phần mười, 0,36 có chữ số 3, còn 0,4 có chữ số 4. Chữ số nào lớn hơn?"}
    worked_solution:
      - "Phần nguyên của hai số đều là 0."
      - "Ở hàng phần mười: 0,36 có chữ số 3, còn 0,4 có chữ số 4."
      - "Vì 3 < 4 nên 0,36 < 0,4."
    explanation: "Phần nguyên đều là 0. Ở hàng phần mười, 0,36 có chữ số 3 còn 0,4 có chữ số 4. Vì 3 < 4 nên 0,36 < 0,4."

  - id: GP-02
    purpose: PRACTICE
    kc_ids: [KC-DEC-CMP, KC-DEC-EQ]
    cognitive_level: B
    difficulty: 0.45
    isomorphic_group: G2
    stem: "Điền dấu >, < hoặc = vào chỗ chấm: 0,4 … 0,45"
    answer: {type: compare, left: "0,4", right: "0,45"}
    rephrase: "Giữa 0,4 và 0,45, con điền dấu >, < hay = giúp cô nhé?"
    hints:
      - {target: TASK, level: 1, text: "Mình cần so sánh 0,4 và 0,45. Con đọc to hai số này giúp cô nhé?"}
      - {target: CONCEPT, level: 2, text: "Theo con, mình so sánh hai số thập phân theo từng hàng hay theo số chữ số của chúng?"}
      - {target: STRATEGY, level: 3, text: "Con thử viết 0,4 thành 0,40, rồi so sánh 0,40 và 0,45 theo từng hàng được không?"}
      - {target: STEP, level: 4, text: "Hai số có cùng phần nguyên là 0 và cùng chữ số 4 ở hàng phần mười. Vậy mình phải so sánh tiếp hàng nào?"}
      - {target: STEP, level: 5, text: "Mình làm từng bước nhỏ nhé. Ở hàng phần trăm, 0,40 có chữ số 0, còn 0,45 có chữ số mấy?"}
    worked_solution:
      - "Phần nguyên của hai số đều là 0, hàng phần mười đều là 4."
      - "Ở hàng phần trăm: 0,4 = 0,40 có chữ số 0, còn 0,45 có chữ số 5."
      - "Vì 0 < 5 nên 0,4 < 0,45."
    explanation: "Hai số có cùng phần nguyên 0 và cùng chữ số 4 ở hàng phần mười. Viết 0,4 thành 0,40 rồi so sánh hàng phần trăm: 0 < 5, nên 0,4 < 0,45."

  - id: GP-02b
    purpose: PRACTICE
    kc_ids: [KC-DEC-CMP, KC-DEC-EQ]
    cognitive_level: B
    difficulty: 0.45
    isomorphic_group: G2
    stem: "Điền dấu >, < hoặc = vào chỗ chấm: 0,7 … 0,72"
    answer: {type: compare, left: "0,7", right: "0,72"}
    hints:
      - {target: TASK, level: 1, text: "Mình cần so sánh 0,7 và 0,72. Con đọc to hai số này giúp cô nhé?"}
