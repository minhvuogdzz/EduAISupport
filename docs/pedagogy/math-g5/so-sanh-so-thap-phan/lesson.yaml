# Lesson package — Toán 5: So sánh hai số thập phân
# TRẠNG THÁI: DRAFT — chờ giáo viên kiểm soát (chủ dự án) duyệt cả bài. Các mục còn chờ duyệt nằm ở
# "Việc của chủ dự án" trong docs/tasks/BACKLOG.md.
#
# Quy ước:
# - Số viết theo kiểu Việt Nam: dấu phẩy thập phân (0,25).
# - hint.level: 1..7 tương ứng H1..H7 (blueprint PART 15). target: TASK | CONCEPT | STRATEGY | STEP | SELF_CHECK | FORMAT.
# - leak_patterns: biểu thức chính quy áp dụng trên văn bản chữ thường CÒN DẤU, bắt buộc có \b ở hai đầu
#   (bỏ dấu sẽ làm "Minh" trùng "mình", "Nam" trùng "năm", "an sai" khớp "bạn sai"). Không câu nào dưới H7
#   (stem, rephrase, hint, verify, các bước giải mẫu trừ bước cuối, phản ví dụ) được khớp pattern của chính câu đó.
# - counter_examples dùng {left}, {right} (chỉ điền được với câu compare), hoặc cặp số không có ở câu nào.
#   Đổi đơn vị chỉ dùng mét → xăng-ti-mét khi số có tối đa 2 chữ số ở phần thập phân.
# - purpose EXIT = câu của hoạt động EXIT_ASSESSMENT: gợi ý tối đa H1, có gợi ý thì bằng chứng chỉ là SUPPORTED.
#   Đáp án, rubric và sample_answer của câu EXIT không bao giờ đưa vào prompt của AI.
# - probe: câu hỏi tách nguyên nhân khi một lựa chọn sai có hai cách giải thích (GP-08, GP-08b).

