# niệm của DI-50, commit riêng và đóng băng bằng thẻ git `eval-freeze-rag-v3` trước mọi thay đổi code; KHÔNG dùng
# để chỉnh tham số nào. Lý do có v3: v1 và v2 đã được xem khi phân tích lỗi (RAG-5), và cả hai gần như chỉ có câu
