# Bộ ca đánh giá lời nói có căn cứ (RAG-2), chương Số thập phân.
#
# Mỗi ca: gia sư vừa giảng cách giảng `ref` của bài `node` và đang chờ con trả lời câu hỏi của cách giảng đó.
# `said` là điều con nói. `expect`:
#   answer: con hỏi một câu về bài, gia sư trả lời từ đoạn truy xuất;
#   same:   con hỏi lại đúng câu gia sư đang hỏi, gia sư không trả lời thay mà mời con tự nghĩ;
#   park:   câu ngoài bài, không đoạn nào làm căn cứ, gia sư không trả lời và ghi lại cho giáo viên;
#   later:  câu về một bài học sau bài đang học: gia sư nói tên bài đó, không dạy trước (plan v1 5.5.3);
#   bridge: con trả lời chưa đúng, gia sư nói một câu nối điều con nói với lời giải thích đã duyệt.
#
# [ASSUME] Ca do AI soạn ngày 2026-10-07, viết trước khi chạy, chờ giáo viên duyệt.
