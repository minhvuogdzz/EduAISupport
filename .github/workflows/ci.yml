name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            services/api/pyproject.toml
            services/api/constraints.txt
      - run: pip install -c services/api/constraints.txt -e "services/api[dev]"
      - run: pip check
      - run: ruff check services/api evals deploy
      - run: ruff format --check services/api evals deploy
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  docker:
    # A clean deployment on Linux, without any real keys or production database.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MONGODB_DB: cavat_test
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated configuration and transfer fixtures
        run: |
          sh deploy/setup.sh
          sed -i 's|^GROQ_API_KEY=.*|GROQ_API_KEY=ci-not-a-key|' .env
          python3 - <<'PYTHON'
          import io, json, tarfile
          docs = [{"_id": "a", "n": 1}, {"_id": "b", "n": 2}]
          manifest = {"database": "ci", "documents": {"ci_probe": len(docs)}}
          with tarfile.open("db-dump/cavat-db.tar.gz", "w:gz") as tar:
              for name, text in (
                  ("manifest.json", json.dumps(manifest)),
                  ("ci_probe.jsonl", "".join(json.dumps(d) + "\n" for d in docs)),
              ):
                  data = text.encode()
                  info = tarfile.TarInfo(name)
                  info.size = len(data)
                  tar.addfile(info, io.BytesIO(data))
          with tarfile.open("db-dump/cavat-storage.tar.gz", "w:gz") as tar:
              data = b"original teacher file"
              info = tarfile.TarInfo("documents/ci/original.txt")
              info.size = len(data)
              tar.addfile(info, io.BytesIO(data))
          PYTHON
          (cd db-dump && sha256sum cavat-db.tar.gz cavat-storage.tar.gz > SHA256SUMS)
      - name: Build, import, and start like the operator
        run: |
          docker compose build --pull
          sh deploy/import.sh
      - name: Verify the one-port app, database, storage and accounts
        run: |
          python3 - <<'PYTHON'
          import json, urllib.request
          base = "http://localhost:8080"
          def get(path):
              return urllib.request.urlopen(base + path)
          assert json.load(get("/health"))["status"] == "ok"
          assert json.load(get("/health/db"))["status"] == "ok"
          assert b'<div id="root"' in get("/").read()
          body = json.dumps({"username": "CI student", "passcode": "728394"}).encode()
          request = urllib.request.Request(base + "/v1/auth/student/register", body, {"Content-Type": "application/json"})
          result = json.load(urllib.request.urlopen(request))
          request = urllib.request.Request(base + "/v1/auth/me", headers={"Authorization": "Bearer " + result["token"]})
          assert json.load(urllib.request.urlopen(request))["kind"] == "STUDENT"
          PYTHON
          curl -s -o /dev/null -w '%{http_code}\n' http://localhost:8080/v1/nope | grep -q 404
          docker compose exec -T app python -c 'from pathlib import Path; assert Path("/data/storage/documents/ci/original.txt").read_text() == "original teacher file"'
          docker compose exec -T app python - <<'PYTHON'
          import urllib.request
          # The API container must reach real voice synthesis on the internal Compose network.
          request = urllib.request.Request('http://voice:8010/speech', data=b'{"text":"Xin chao con"}', headers={'Content-Type': 'application/json'})
          with urllib.request.urlopen(request, timeout=180) as response:
              assert response.read(4) == b'RIFF'
          PYTHON
      - name: Refuse a second database import with the documented exit code
        run: |
          set +e
          docker compose run --rm --no-deps app python -m cavat.restore /dump/cavat-db.tar.gz
          result=$?
          set -e
          test "$result" -eq 2
      - name: Logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Clean up isolated test volumes
        if: always()
        run: docker compose down -v

  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated stack
        run: |
          sh deploy/setup.sh
          sed -i 's|^GROQ_API_KEY=.*|GROQ_API_KEY=ci-not-a-key|' .env
      - name: Build voice and check actual speech synthesis
        run: |
          docker compose build voice
          docker compose up -d --wait --wait-timeout 900 voice
          docker compose exec -T voice python - <<'PYTHON'
          import urllib.request
          request = urllib.request.Request('http://127.0.0.1:8010/speech', data=b'{"text":"Xin chao con"}', headers={'Content-Type': 'application/json'})
          with urllib.request.urlopen(request, timeout=180) as response:
              assert response.read(4) == b'RIFF'
          PYTHON
      - name: Logs
        if: failure()
        run: docker compose logs --no-color --tail 200 voice
      - name: Clean up
        if: always()
        run: docker compose down -v
