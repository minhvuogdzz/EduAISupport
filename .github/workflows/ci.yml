name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e "services/api[dev]"
      - run: ruff check services/api evals
      - run: ruff format --check services/api evals
      - run: pytest -q
