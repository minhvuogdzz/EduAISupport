# CAVAT AI Tutor on one machine: the app (web + API on one port) and its MongoDB. ADR-036, deploy/README.md.
#   sh deploy/setup.sh && docker compose up -d --build
name: cavat

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: cavat
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_PASSWORD:?MONGO_PASSWORD chưa có trong .env, chạy sh deploy/setup.sh}"
    volumes:
      - mongo-data:/data/db
    # no ports: only the app, on this compose network, can reach the database
    healthcheck:
      test:
        - CMD-SHELL
        - 'mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.runCommand({ping:1}).ok" | grep -q 1'
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 20s
    logging: *logging

  app:
    build:
      context: .
      args:
        CAVAT_REVISION: "${CAVAT_REVISION:-unknown}"
    image: cavat-app:latest
    restart: unless-stopped
    init: true
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: "mongodb://cavat:${MONGO_PASSWORD:?MONGO_PASSWORD chưa có trong .env, chạy sh deploy/setup.sh}@mongo:27017/?authSource=admin"
      MONGODB_DB: "${MONGODB_DB:-cavat_prod}"
      GROQ_API_KEY: "${GROQ_API_KEY:?GROQ_API_KEY chưa có trong .env}"
      GROQ_MODEL: "${GROQ_MODEL:-qwen/qwen3.8-27b}"
      GROQ_STT_MODEL: "${GROQ_STT_MODEL:-whisper-large-v3}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_VISION_MODEL: "${GEMINI_VISION_MODEL:-gemini-3.8-flash}"
      GEMINI_VISION_FALLBACKS: '${GEMINI_VISION_FALLBACKS:-["gemini-2.5-flash","gemini-3.5-flash-lite"]}'
      GEMINI_EMBEDDING_MODEL: "${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}"
      AUTH_SECRET: "${AUTH_SECRET:?AUTH_SECRET chưa có trong .env, chạy sh deploy/setup.sh}"
      AUTH_MODE: accounts
      TUTOR_RENDERER: llm
      MAX_LLM_CALLS_PER_SESSION: "${MAX_LLM_CALLS_PER_SESSION:-40}"
      MAX_LLM_CALLS_PER_CHAPTER: "${MAX_LLM_CALLS_PER_CHAPTER:-160}"
      TUTOR_MODELS: "${TUTOR_MODELS:-}"
      TUTOR_CHOOSER: "${TUTOR_CHOOSER:-llm}"
      TUTOR_MENTOR_MODEL: "${TUTOR_MENTOR_MODEL-gemini-4-argon}"
      GEMINI_TUTOR_FALLBACKS: '${GEMINI_TUTOR_FALLBACKS:-["gemini-2.5-flash","gemini-3.8-flash"]}'
      ALLOW_TUTOR_KNOWLEDGE: "${ALLOW_TUTOR_KNOWLEDGE:-true}"
      WEB_LOOKUP: "${WEB_LOOKUP:-search}"
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD chưa có trong .env}"
      TTS: "${TTS:-vieneu}"
      VIENEU_URL: "http://voice:8010"
      VIENEU_VOICE: "${VIENEU_VOICE:-}"
      OBSERVABILITY_ENABLED: "${OBSERVABILITY_ENABLED:-true}"
    volumes:
      - app-data:/data/storage
      # where the database export is put to be loaded (deploy/README.md); read-only
      - ./db-dump:/dump:ro
    ports:
      - "${PORT:-8080}:8000"
    logging: *logging

  voice:
    build:
      context: .
      dockerfile: services/voice/Dockerfile
    image: cavat-voice:latest
    restart: unless-stopped
    init: true
    environment:
      VOICE_HOST: 0.0.0.0
      HF_HUB_CACHE: /data/huggingface/hub
    volumes:
      - voice-models:/data/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10m
    logging: *logging

  # Optional HTTPS in front of the app (the microphone only works on HTTPS): docker compose --profile https up -d
  https:
    profiles: ["https"]
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    command: ["caddy", "reverse-proxy", "--from", "${DOMAIN:-localhost}", "--to", "app:8000"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

volumes:
  mongo-data:
  app-data:
  voice-models:
  caddy-data:
  caddy-config:
